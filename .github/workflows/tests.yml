# Unit tests for keeper, audit and desk's tool allowlist. Standard library only: no Docker, no model account, no secrets.
# The full scenes need a running Switch stack and are checked with ./scripts/verify.sh (see README).
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
